# Launcher template, not a directly runnable config. All @...@ values are JSON-
# quoted TOML strings/arrays generated by libreoffice-demo.py for one scratch run.
[sandbox]
token = 'lpac'
workdir = @WORK@

[allow.deep]
execute = [@APP@]
read = @DATA@
write = @DATA@
delete = @DATA@

[allow.this]
read = @ANCESTORS@
# The working directory itself needs traverse/execute; its files do not.
execute = [@WORK@]

[capabilities]
names = ['registryRead', 'lpacCom']

[privileges]
child_processes = false
loopback = false
clipboard_read = false
clipboard_write = false

[environment]
inherit = false
pass = ['HOME', 'SAL_DISABLESKIA', 'SAL_DISABLE_OPENCL']

[pipes]
@SOURCE@ = @DESTINATION@

