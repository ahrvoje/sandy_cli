# Mixed AC+RT test — Restricted Token instance config
# Grants all on test_mixed/shared, read on test_mixed/scripts,
# deny write on test_mixed/shared/protected

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_mixed\scripts']
all = ['%USERPROFILE%\test_mixed\shared']

[deny.deep]
write   = ['%USERPROFILE%\test_mixed\shared\protected']

[environment]
inherit = true

[limit]
timeout = 30
