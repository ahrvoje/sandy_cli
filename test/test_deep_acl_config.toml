# Deep ACL test: 4 levels, selective allows per subfolder (AC, no deny)
#
# In AC mode there is no deny, so "restricted" zones are implemented by
# withholding grants rather than layering deny over allow.
#
# TREE (4 levels deep):
#   test_deep/
#     app/
#         core/                   [allow.deep] read  (read-only, no write)
#           engine/               inherits read from core
#         contrib/                (no grant → blocked)
#           plugins/              (no grant → blocked)
#       docs/
#         public/                 [allow.deep] all (inherits to guides/)
#         classified/             (no grant → blocked, AC can't do write-only)
#           memos/                (no grant → blocked)
#     library/
#       stable/                   [allow.deep] read (inherits to v1/)
#       experimental/             (no grant → blocked)
#     scripts/
#       common/                   [allow.deep] execute + read
#       restricted/               (no grant → blocked)

[sandbox]
token = 'appcontainer'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_deep\scripts\common']
read = ['%USERPROFILE%\test_deep\scripts\test_deep_acl.py', '%USERPROFILE%\test_deep\scripts\common', '%USERPROFILE%\test_deep\app\src\core', '%USERPROFILE%\test_deep\library\stable']
all = ['%USERPROFILE%\test_deep\app\docs\public']

[environment]
inherit = true

[limit]
timeout = 60
