# Expert adversarial test config — Restricted Token mode
#
# TREE (created by batch runner):
#   test_expert/
#     arena/                        [allow all]
#       denied_zone/                [deny all]
#       readonly_zone/              [deny write]
#       double_deny/                [deny write + deny read]
#       deep/a/b/c/d/               [deny all]
#       playground/                 inherits all
#     scripts/                      [allow read]

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_expert\scripts']
all = ['%USERPROFILE%\test_expert\arena']

[deny.deep]
all = [
    '%USERPROFILE%\test_expert\arena\denied_zone',
    '%USERPROFILE%\test_expert\arena\deep\a\b\c\d',
]
write = [
    '%USERPROFILE%\test_expert\arena\readonly_zone',
    '%USERPROFILE%\test_expert\arena\double_deny',
]
read = [
    '%USERPROFILE%\test_expert\arena\double_deny',
]

[privileges]
child_processes = false

[limit]
timeout = 90
