# Sandy test configuration — allow & limits tests, Restricted Token mode
# All scripts live in %USERPROFILE%\test_limits\scripts

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = [
    '%LOCALAPPDATA%\Programs\Python\Python314',
    '%USERPROFILE%\test_limits\scripts',
]
[environment]
inherit = true

[limit]
timeout = 5
memory = 128
processes = 3
