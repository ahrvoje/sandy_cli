# Diabolical test config (AC, no deny)
#
# TREE:
#   test_diabolical/
#     scripts/              [allow read]
#     arena/
#       killzone/           (no grant) — empty, target for delete-recreate
#       fortress/           (no grant) — has files, rename target
#       readonly_zone/      [allow read] (was deny.write)
#       playground/         [allow all] — self-DACL escalation testing

[sandbox]
token = 'appcontainer'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']
read = ['%USERPROFILE%\test_diabolical\scripts', '%USERPROFILE%\test_diabolical\arena\readonly_zone']
all = ['%USERPROFILE%\test_diabolical\arena\playground']

[privileges]
child_processes = false

[environment]
inherit = true

[limit]
timeout = 60
