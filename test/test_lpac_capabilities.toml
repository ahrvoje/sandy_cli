[sandbox]
token = 'lpac'

[allow.this]
execute = ['%SANDY_PIPE_TEST_DIR%', '%SANDY_PIPE_TEST_DIR%\pipe_hook_app.exe']

[capabilities]
names = ['registryRead', 'lpacCom', 'lpacCryptoServices', 'lpacIdentityServices', 'internetClient', 'privateNetworkClientServer', 'REGISTRYREAD']

[privileges]
loopback = false
child_processes = false

[pipes]
'\\.\pipe\sandy-capability-test' = '\\.\pipe\LOCAL\sandy-capability-test'

[limit]
timeout = 15
