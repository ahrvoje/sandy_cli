# Complex ACL grants test — Restricted Token mode
#
# FOLDER TREE:
#   test_acl/
#     workspace/          [allow.deep] all
#       src/              (inherits all)
#       build/            [deny.deep] write → read OK, write blocked
#       secrets/          [deny.deep] all → everything blocked (delete too)
#     data/               [allow.deep] read
#       public/           (inherits read)
#       private/          [deny.deep] read → read blocked (deny > allow)
#     logs/               [allow.deep] append
#     tools/              [allow.deep] execute → read+exec, no write

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
execute = ['%USERPROFILE%\test_acl\tools']
read = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_acl\scripts', '%USERPROFILE%\test_acl\data']
append = ['%USERPROFILE%\test_acl\logs']
all = ['%USERPROFILE%\test_acl\workspace']

[deny.deep]
read    = ['%USERPROFILE%\test_acl\data\private']
write   = ['%USERPROFILE%\test_acl\workspace\build']
all     = ['%USERPROFILE%\test_acl\workspace\secrets']
[environment]
inherit = true

[limit]
timeout = 30
