# Grant Matrix Test — Restricted Token (deep vs this + deny combos)
#
# Zones Z1-Z5: same allow structure as AC config
# Z6: allow.deep all + deny.deep write — deny subtracts write from all
# Z7: deny.this read on parent + allow.deep all on child — child must NOT inherit deny
# Z8: deny.deep all + allow.this read on SAME PATH — what wins?
# Z9: deny.this write + allow.deep read on the same directory

[sandbox]
token     = 'restricted'
integrity = 'low'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']
read    = ['%TEST_ROOT%\scripts', '%TEST_ROOT%\same_path', '%TEST_ROOT%\deep_hole', '%TEST_ROOT%\file_vs_dir', '%TEST_ROOT%\deny_scope']
all     = ['%TEST_ROOT%\overlap\inner', '%TEST_ROOT%\deep_hole\gap\bottom', '%TEST_ROOT%\deny_sub', '%TEST_ROOT%\deny_parent\child']
write   = ['%TEST_ROOT%\deny_clash']

[allow.this]
read    = ['%TEST_ROOT%\overlap', '%TEST_ROOT%\multi_this', '%TEST_ROOT%\deny_clash']
write   = ['%TEST_ROOT%\same_path', '%TEST_ROOT%\multi_this\mid', '%TEST_ROOT%\file_vs_dir\target.txt']
all     = ['%TEST_ROOT%\multi_this\mid\leaf']

[deny.deep]
write   = ['%TEST_ROOT%\deny_sub']
all     = ['%TEST_ROOT%\deny_clash']

[deny.this]
read    = ['%TEST_ROOT%\deny_parent']
write   = ['%TEST_ROOT%\deny_scope']

[environment]
inherit = true

[limit]
timeout = 60
