# DACL fidelity test — AppContainer mode
#
# Allow rules on protected and on inheriting objects (AppContainer has no
# deny rules).  After the run each DACL must be identical to the one before.

[sandbox]
token = 'appcontainer'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']
read    = ['%TEST_ROOT%\scripts', '%TEST_ROOT%\arena\secret']
all     = ['%TEST_ROOT%\arena\frozen']

[allow.this]
read  = ['%TEST_ROOT%\single']
write = ['%TEST_ROOT%\arena\lockfile.txt', '%TEST_ROOT%\arena\keep\victim.txt']

[environment]
inherit = true

[limit]
timeout = 60
