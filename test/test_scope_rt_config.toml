# Sandy scope test — Restricted Token allow + deny, deep + this
[sandbox]
token     = 'restricted'
integrity = 'low'

[allow.deep]
all     = ['%USERPROFILE%\test_scope\deep', '%USERPROFILE%\test_scope\deep_all']
execute = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_scope\scripts']

[allow.this]
all = ['%USERPROFILE%\test_scope\this']

# deny tests: deny_deep and deny_this get NO allow grants
# RT low has BUILTIN\Users read from OS, so deny must override that
[deny.deep]
all = ['%USERPROFILE%\test_scope\deny_deep']

[deny.this]
all = ['%USERPROFILE%\test_scope\deny_this']

[environment]
inherit = true
