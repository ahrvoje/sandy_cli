# Sandy hardening test — minimal config for quick log marker tests.
# Uses Python (user-owned path) for fast startup/exit.

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = ['%LOCALAPPDATA%\Programs\Python\Python314', '%SANDY_TEST_DIR%test_hardening_exit.py']

[environment]
inherit = true

[limit]
timeout = 10
