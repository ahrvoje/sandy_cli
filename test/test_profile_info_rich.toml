# Rich profile-info fixture for profile display regression coverage.

[sandbox]
token = 'appcontainer'
workdir = '%USERPROFILE%\test_sandy_profile\info\work'

[allow.deep]
read = ['%USERPROFILE%\test_sandy_profile\info\data']
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']

[privileges]
stdin = '%USERPROFILE%\test_sandy_profile\info\input.txt'
clipboard_write = true
child_processes = false

[environment]
inherit = false
pass = ['TEMP']

[limit]
timeout = 12
memory = 64
processes = 2
