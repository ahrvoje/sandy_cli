# Sandy sandbox test configuration — Restricted Token mode
# Used by: sandy.exe -c test_sandy_restricted_config.toml -x <python.exe> test_sandy.py
# Sandy sandbox test configuration — Restricted Token mode
# Used by: sandy.exe -c test_sandy_restricted_config.toml -x <python.exe> test_sandy.py

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = [
    '%LOCALAPPDATA%\Programs\Python\Python314',
    '%USERPROFILE%\test_sandy\scripts',
    '%USERPROFILE%\test_sandy\R',
    '%USERPROFILE%\test_sandy\file_R.txt',
]
write = [
    '%USERPROFILE%\test_sandy\W',
    '%USERPROFILE%\test_sandy\file_W.txt',
]
all = [
    '%USERPROFILE%\test_sandy\RW',
    '%USERPROFILE%\test_sandy\file_RW.txt',
]

[environment]
inherit = true
