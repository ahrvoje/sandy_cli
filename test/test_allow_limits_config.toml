# Sandy test configuration — allow & limits tests
# All scripts live in %USERPROFILE%\test_limits\scripts

[sandbox]
token = 'appcontainer'

[allow.deep]
read = [
    '%LOCALAPPDATA%\Programs\Python\Python314',
    '%USERPROFILE%\test_limits\scripts',
]

[capabilities]
names = ['internetClient']

[environment]
inherit = true

[limit]
timeout = 5
memory = 128
processes = 3
