# Phantom test config (AC, no deny)
# Theme: persistence, observation, and cleanup interference
#
# arena/
#   workspace/   [allow all] — writable zone for test fixtures
#   forbidden/   (no grant — fully blocked)
#   readonly/    [allow read]

[sandbox]
token = 'appcontainer'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']
read = ['%USERPROFILE%\test_phantom\scripts', '%USERPROFILE%\test_phantom\arena\readonly']
all = ['%USERPROFILE%\test_phantom\arena\workspace']

[privileges]
child_processes = false
[limit]
timeout = 90
