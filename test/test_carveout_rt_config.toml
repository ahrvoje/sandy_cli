# Carve-out test — Restricted Token mode
#
# Allow rules nested UNDER a deny.  The rule on the nearer folder wins,
# right by right: an allow gives back exactly the rights it names, at its
# own scope (subtree for allow.deep, the one directory for allow.this).
#
# FOLDER TREE:
#   test_carveout/
#     arena/                [allow.deep] all
#       open/               (inherits all — sanity zone)
#       blocked/            [deny.deep] all → everything below denied...
#         inner/            (inherits deny)
#         carve/            [allow.deep] write → write-only carve-out
#           sub/            (write allowed, read still denied)
#         full/             [allow.deep] all → full carve-out
#           sub/            (full access)
#         slot/             [allow.this] all → single-directory carve-out
#           inner/          (keeps inherited deny — the allow must not recurse)
#     scripts/              [allow.deep] read

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read  = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_carveout\scripts']
all   = ['%USERPROFILE%\test_carveout\arena', '%USERPROFILE%\test_carveout\arena\blocked\full']
write = ['%USERPROFILE%\test_carveout\arena\blocked\carve']

[allow.this]
all = ['%USERPROFILE%\test_carveout\arena\blocked\slot']

[deny.deep]
all = ['%USERPROFILE%\test_carveout\arena\blocked']

[environment]
inherit = true

[limit]
timeout = 30
