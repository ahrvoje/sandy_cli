# Sandy scope test — AppContainer allow.deep + allow.this
[sandbox]
token = 'appcontainer'

[allow.deep]
all     = ['%USERPROFILE%\test_scope\deep', '%USERPROFILE%\test_scope\deep_all']
execute = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_scope\scripts']

[allow.this]
all     = ['%USERPROFILE%\test_scope\this']

[environment]
pass = ['PATH', 'TEST_ROOT', 'TEST_MODE']
