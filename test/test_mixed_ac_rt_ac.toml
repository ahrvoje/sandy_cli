# Mixed AC+RT test — AppContainer instance config (AC, no deny)
# Grants all on shared/workspace, read on shared/protected

[sandbox]
token = 'appcontainer'

[allow.deep]
execute = ['%LOCALAPPDATA%\Programs\Python\Python314']
read = ['%USERPROFILE%\test_mixed\scripts', '%USERPROFILE%\test_mixed\shared\protected']
all = ['%USERPROFILE%\test_mixed\shared\workspace']

[environment]
inherit = true

[limit]
timeout = 30
