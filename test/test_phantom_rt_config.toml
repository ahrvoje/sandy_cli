# Phantom test config — Restricted Token mode
# Theme: persistence, observation, and cleanup interference

[sandbox]
token = 'restricted'
integrity = 'medium'

[allow.deep]
read = ['%LOCALAPPDATA%\Programs\Python\Python314', '%USERPROFILE%\test_phantom\scripts']
all = ['%USERPROFILE%\test_phantom\arena']

[deny.deep]
all = ['%USERPROFILE%\test_phantom\arena\forbidden']
write = ['%USERPROFILE%\test_phantom\arena\readonly']

[privileges]
child_processes = false

[limit]
timeout = 90
